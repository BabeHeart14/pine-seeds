name: Update Thai Market Breadth

on:
  schedule:
    - cron: '15 10 * * 1-5' # 10:15 UTC = 17:15 เวลาประเทศไทย (จันทร์-ศุกร์)
  workflow_dispatch: # กดสั่งรันด้วยตัวเองได้ทันที

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas tradingview-screener

      - name: Run Market Breadth script
        run: python update_breadth.py

      - name: Commit and push updated CSVs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*.csv
          git commit -m "Update SET Market Breadth data" || exit 0
          git push
